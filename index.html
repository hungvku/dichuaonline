<div id="start" class="abs"><h1>🏮 Chùa Bình An 🏮</h1><p>Thắp hương cầu bình an, thả cá phóng sinh, làm việc thiện mỗi ngày.<br><br>Di chuyển: joystick hoặc phím WASD. Lại gần bàn thờ, hồ cá, cây bồ đề… để tương tác.</p><button id="go">VÀO CHÙA</button></div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const KEY='chuaBinhAn_v1',FISH={koi_red:{n:'Koi đỏ',p:10,c:'#ff4a36',c2:'#ffffff'},koi_white:{n:'Koi trắng',p:10,c:'#fdfdfd',c2:'#ff8a3d'},gold:{n:'Cá vàng',p:5,c:'#ffb81c',c2:'#ffe08a'},carp:{n:'Chép nhiều màu',p:15,c:'#4aa8ff',c2:'#ff6fb0'}};

function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o){const d=Object.assign(def(),o);if(d.day!==today()){d.day=today();d.q={inc:0,fish:0,claimed:{}};d.vis={}}return d}}catch(e){}return def()}
let s=load();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}schedSync()};
const lv=()=>1+Math.floor(s.total/40),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
let sd=7;const rd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const PR=['🙏 Cầu bình an cho gia đình','🙏 Cầu sức khỏe và may mắn','🙏 Cầu công việc thuận lợi','🙏 Cầu tài lộc và thành công'];
const ZO={mo:{x:300,y:470,r:60,n:'Gác mõ tụng kinh',a:'🪘 GÕ MÕ'},quan:{x:650,y:456,r:60,n:'Tượng Quan Thế Âm',a:'🌸 DÂNG HOA'},xam:{x:860,y:440,r:60,n:'Ống xăm',a:'🎋 XIN XĂM'},chao:{x:330,y:738,r:65,n:'Nhà bếp chay',a:'🍲 NẤU CHÁO'},den:{x:640,y:726,r:60,n:'Bến hoa đăng',a:'🏮 THẢ HOA ĐĂNG'},milac:{x:200,y:436,r:55,n:'Phật Di Lặc',a:'😊 XOA BỤNG'},enter:{x:455,y:250,r:48,n:'Cửa chính điện',a:'🚪 VÀO CHÍNH ĐIỆN'},gate:{x:500,y:745,n:'Cổng tam quan'},hall:{x:500,y:322,n:'Chính điện',a:'🕯 THẮP HƯƠNG'},pond:{x:790,y:560,r:195,n:'Hồ phóng sinh',a:'🐟 THẢ CÁ'},lotus:{x:150,y:628,n:'Vườn hoa sen',a:'🌸 NGỒI THIỀN'},bodhi:{x:150,y:262,n:'Cây bồ đề',a:'🙏 CẦU BÌNH AN'},bell:{x:860,y:256,n:'Nhà chuông',a:'🔔 ĐÁNH CHUÔNG'}};
let Z=ZO,sc=0;const ZI={fort:{x:335,y:526,r:55,n:'Bàn xem quẻ',a:'🔮 XEM QUẺ · TỬ VI'},bangvang:{x:215,y:516,r:60,n:'Bảng vàng',a:'🏅 XEM BẢNG VÀNG'},bangcd:{x:785,y:516,r:60,n:'Bảng công đức',a:'📜 XEM BẢNG CÔNG ĐỨC'},incense:{x:500,y:440,r:50,n:'Bát hương',a:'🕯 THẮP HƯƠNG'},altar:{x:500,y:520,r:60,n:'Bàn thờ Phật',a:'🙇 LẠY PHẬT'},door:{x:500,y:1070,r:75,n:'Cửa chính điện',a:'🚪 RA SÂN'}};
/* ===== audio ===== */
let ac,master,mute=false;
function tone(f,d,v,type='sine',t0=0){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime+t0;o.type=type;o.frequency.value=f;n.gain.setValueAtTime(0,T);n.gain.linearRampToValueAtTime(v,T+.03);n.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(n);n.connect(master);o.start(T);o.stop(T+d+.1)}
function bell(){[392,784,1180,1570,2360].forEach((f,i)=>tone(f,4.5-i*.6,.45/(i+1)))}
function bowl(){[0,1.1,2.2].forEach((d,i)=>[660,1560,2640].forEach((f,j)=>tone(f,3.2-j*.6,.5/(j+1)*(1-i*.12),'sine',d)))}
function strike(){[660,1560].forEach((f,j)=>tone(f,3.2-j,.3/(j+1)))}
function fanfare(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,1.1,.3,'triangle',i*.11));bell()}
function chime(){[784,988,1318].forEach((f,i)=>tone(f,.9,.22,'sine',i*.1))}
function silentWav(){const n=2000,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,x)=>[...x].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlock(){try{if(window.speechSynthesis&&!window._sp){window._sp=1;const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{if(!window._sa){const a=document.createElement('audio');a.src=silentWav();a.loop=true;a.setAttribute('playsinline','');window._sa=a}window._sa.play().catch(()=>{})}catch(e){}}
function chirp(){if(mute)return;const b=1700+Math.random()*1300;for(let i=0;i<3;i++)tone(b+i*260,.12,.05,'sine',i*.13)}
function initA(){unlock();if(ac){ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=mute?0:.9;const cm=ac.createDynamicsCompressor();master.connect(cm);cm.connect(ac.destination);const sr=ac.createBufferSource();sr.buffer=ac.createBuffer(1,1,22050);sr.connect(ac.destination);sr.start(0);const ch=[[392,494,588],[349,440,523],[330,392,494],[294,392,440]];let i=0;const go=()=>{if(!mute)ch[i++%4].forEach(f=>tone(f,6.5,.07))};go();setInterval(go,5500);setInterval(chirp,5000)}catch(e){}}
['pointerdown','touchend'].forEach(ev=>addEventListener(ev,()=>{if(ac&&ac.state!=='running')ac.resume()},{passive:true}));
/* ===== ui ===== */
let tt,st;

function say(m,ms=3800){const e=$('say');e.textContent=m;e.style.opacity=1;clearTimeout(st);st=setTimeout(()=>e.style.opacity=0,ms)}
function hud(){$('hud').innerHTML=`🌸 Công đức <b>${s.merit}</b> · ✨ Phúc đức <b>${s.virtue}</b><br>🕯 ${s.inc} lần · 🐟 ${s.fishN} cá · <b>Cấp ${lv()} · ${ttl()}</b><br><small>${stat()}</small><div id="bar"><i style="width:${s.total%40/40*100}%"></i></div>`}
function gain(m,v){const L=lv();s.merit+=m;s.virtue+=v;s.total+=m+v;chime();burst(18);if(lv()>L)celebrate();save();hud()}
const QS=[{k:'inc',t:'Thắp hương 3 lần',g:3,r:15},{k:'fish',t:'Thả 5 con cá',g:5,r:20},{k:'exp',t:'Khám phá 3 địa điểm',g:3,r:15},{k:'lay',t:'Lạy Phật 1 lần trong chính điện',g:1,r:10},{k:'med',t:'Ngồi thiền 1 lần',g:1,r:10},{k:'exp6',t:'Khám phá 7 địa điểm',g:7,r:25},{k:'mo',t:'Gõ mõ tụng kinh 1 lần',g:1,r:10},{k:'dang',t:'Dâng hoa Quan Thế Âm 2 lần',g:2,r:12},{k:'xam',t:'Xin quẻ đầu ngày',g:1,r:8},{k:'chao',t:'Nấu cháo từ thiện 2 lần',g:2,r:15},{k:'den',t:'Thả 1 hoa đăng',g:1,r:10},{k:'xoa',t:'Xoa bụng Phật Di Lặc 3 lần',g:3,r:10},{k:'bell',t:'Đánh chuông 3 lần',g:3,r:8},{k:'bodhi',t:'Cầu bình an ở cây bồ đề 2 lần',g:2,r:10},{k:'med30',t:'Ngồi thiền đủ 30 giây',g:1,r:15},{k:'chat',t:'Gửi 1 lời chúc cho mọi người',g:1,r:5},{k:'fort',t:'Xem quẻ 3 chủ đề trong chính điện',g:3,r:15},{k:'uoc',t:'Gửi 1 điều ước khi ngồi thiền',g:1,r:10},{k:'tuvi',t:'Lập lá số tử vi',g:1,r:10}];

const ACH=[['🕯 Lần đầu thắp hương',()=>s.inc>=1],['🕯 Thắp hương 10 lần',()=>s.inc>=10],['🐟 Phóng sinh 5 cá',()=>s.fishN>=5],['🐠 Phóng sinh 25 cá',()=>s.fishN>=25],['⭐ Đạt cấp 3',()=>lv()>=3],['🏅 Đạt cấp 5',()=>lv()>=5],['📜 Xong mọi nhiệm vụ hằng ngày',()=>QS.every(q=>s.q.claimed[q.k])],['🙇 Lạy Phật 10 lần',()=>(s.lay||0)>=10],['🪘 Gõ mõ 100 tiếng',()=>(s.moN||0)>=100],['🏮 Thả 5 hoa đăng',()=>(s.lantern||0)>=5],['🍲 Nấu 10 nồi cháo',()=>(s.chao||0)>=10]];

function panel(k){curP=k;const el=$('panel');if(!k){el.hidden=true;return}el.className=k==='tuvi'?'wide':'';let h='';
